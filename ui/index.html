<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>excalidraw-rs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tints the browser chrome above the window to the titlebar's own color,
         so there is no light seam over the app's. Dark --bg-alt, because dark
         is what a window shows before the appearance is resolved; theme.js
         rewrites it from the live token the moment it runs, and on every
         switch after. -->
    <meta name="theme-color" content="#17171a" />
    <script>
      // Decided before the stylesheet is applied, and deliberately inline: the
      // titlebar reserves a strip on the left for macOS' traffic lights
      // (tauri.conf.json puts them at x:10, y:20 under titleBarStyle:
      // "Overlay", which means they float over our own chrome and we owe them
      // the room). Outside Tauri — a plain browser opening ui/ off disk, which
      // is how the painter gets exercised without building the app — there are
      // no window controls at all and the strip is dead space.
      //
      // withGlobalTauri injects __TAURI__ before any page script runs, so this
      // is decidable synchronously, before first paint, with no flash of
      // wrongly-padded chrome. Same trick, and the same class name, as
      // term.hut's index.html.
      if (!window.__TAURI__) document.documentElement.classList.add("web");

      // The appearance, decided before the stylesheet is applied and for the
      // same reason the strip above is: the alternative is a window that
      // flashes dark and then repaints light on every launch. theme.js owns
      // the setting; this is the twelve lines of it that have to run before
      // first paint, so it deliberately duplicates the key name and the
      // fallback rather than importing a module (a module is fetched, and a
      // fetch is a frame).
      //
      // Only the *resolved* theme goes on the element. The stylesheet then has
      // two cases instead of three and never asks what the system is doing.
      try {
        const stored = localStorage.getItem("xd-appearance");
        const pref = stored === "light" || stored === "dark" ? stored : "system";
        const root = document.documentElement;
        root.dataset.themePref = pref;
        root.dataset.theme = pref === "system"
          ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : pref;
      } catch {
        // Storage refused, or there is no matchMedia. Dark is the documented
        // default and the stylesheet already assumes it.
      }

      // The last resort. shell.js reports the failures it can see, but a
      // module that fails to parse or to resolve never runs, so its own
      // handler never installs — and the whole window is blank with the
      // reason only in a console the user has no reason to open. A drawing
      // app that shows nothing is indistinguishable from a drawing app that
      // lost the drawing, which is the fear this exists to answer.
      (() => {
        let shown = false;
        const report = (what) => {
          if (shown) return;
          shown = true;
          const say = () => {
            const host = document.getElementById("host");
            if (!host) return;
            const note = document.createElement("div");
            note.className = "boot-error";
            note.textContent = `excalidraw-rs couldn't start: ${what}`;
            host.replaceChildren(note);
          };
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", say, { once: true });
          } else {
            say();
          }
        };
        addEventListener("error", (ev) => {
          // A failed <script>/<link> load reports its element, not a message.
          const src = ev.target?.src ?? ev.target?.href;
          report(src ? `${src} didn't load` : ev.message || "an unknown error");
        }, true);
        addEventListener("unhandledrejection", (ev) =>
          report(String(ev.reason?.message ?? ev.reason ?? "an unknown error")));
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- The whole of the app's chrome. One row: what the document is called on
         the left, and whatever the mounted view wants to contribute on the
         right. The view builds no bar of its own — same discipline as
         term.hut's pane header, and the reason the port is a copy rather than
         an unpicking (see viewActions.js). -->
    <header id="titlebar">
      <div id="titlebar-left">
        <!-- The sidebar toggle, built by shell.js. First thing after the
             traffic lights, which is where macOS puts one. -->
        <div id="sidebar-slot"></div>
        <div id="doc">
          <!-- Both filled by textContent from shell.js; never innerHTML. -->
          <span id="doc-name">Untitled</span>
          <!-- The dirty marker. A dot rather than a word, because it changes on
               every keystroke and a word that flickers is noise. -->
          <span id="doc-dirty" hidden aria-hidden="true">●</span>
        </div>
      </div>
      <!-- The mounted view's tool island, hosted by the app rather than
           floating over the canvas. macOS puts a window's tools in its
           titlebar (a unified toolbar), not in a card laid on top of the
           document, and a drawing app has less to lay a card on than most.
           shell.js hands this element to the view as its toolbar slot; a view
           mounted anywhere without one — a browser opening ui/ off disk,
           term.hut's pane — keeps the floating island it has always had. -->
      <div id="tool-slot"></div>

      <div id="titlebar-right">
        <!-- One line of trouble, and only trouble: a failed save, a file that
             would not open, "no app host". Everything that is merely *true* —
             the zoom, the live tool, whether the last autosave landed — went
             into the menu or onto the canvas, but a failure the user has not
             seen yet may not be behind a click. -->
        <span id="app-status" hidden></span>
        <!-- menu.js: every verb the app has, behind one button. -->
        <div id="menu-slot"></div>
      </div>
    </header>

    <!-- One full-bleed host, and the view owns everything inside it. The
         editor is handed this element and may not touch anything outside it —
         that rule is what Phase 5's import allowlist mechanises, and this is
         the element the rule is about. -->
    <main id="host"></main>

    <script type="module" src="standalone/shell.js"></script>
  </body>
</html>
