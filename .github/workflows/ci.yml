# The gates PLAN.md asks for, in the order they fail fastest.
#
# The two JS guards are not decoration: the portable view's only consumer for
# most of this project's life is an app with every incentive to reach into it,
# and nothing will organically prove it is still host-independent until the
# port lands (PLAN.md Phase 5). check-imports.mjs is that proof.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p xd-core
      - run: cargo clippy -p xd-core -p xd-wasm --all-targets -- -D warnings
      - run: scripts/check-licenses.sh

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The freshness check below reads history to compare the vendored
          # artifact against its sources, and the default single-commit clone
          # would let it answer "nothing changed" to everything.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      # Builds and asserts the 586 KB budget. The number is the size of
      # bpmn-js in term.hut, which is already dynamically imported there — so
      # matching it means the WASM core is a precedent, not a regression.
      - run: scripts/build-wasm.sh
      # A vendored artifact that drifts from its source is worse than none:
      # ui/ is served straight off disk, so what is committed is what ships.
      # Asked of history rather than of the bytes — a release WASM build is not
      # byte-reproducible across toolchains, and the diff this replaces failed
      # on artifacts that were perfectly current. See the script's header.
      - run: scripts/check-wasm-fresh.sh

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test
      - run: bun scripts/check-imports.mjs
